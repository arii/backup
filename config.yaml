# Posture Guard configuration. All durations in seconds, all angles in degrees.
# Unknown keys and wrong-typed values are rejected at startup (ConfigError).

camera:
  # webcam (default): any USB/laptop camera via OpenCV + MediaPipe Pose.
  # synthetic: no camera, scripted good/slouch demo. --camera overrides this.
  source: webcam
  device: 0             # webcam index (cv2.VideoCapture); --device overrides
  demo_cycle_s: 20.0    # synthetic demo: 20 s good, 20 s slouch, repeating
  width: 640
  height: 480
  fps: 30

scoring:
  # A metric is "bad" when its absolute value passes the threshold.
  # Hysteresis: it only counts as "good" again once it falls back below
  # (threshold - hysteresis_margin_deg).
  head_forward_deg: 8.0
  trunk_lean_deg: 7.0
  head_tilt_deg: 8.0
  shoulder_level_deg: 4.0
  hysteresis_margin_deg: 3.0
  # Slow-baseline deviation check: an EMA of each angle over ~5 min tracks the
  # user's own recent neutral, so whole-torso slouch (head and shoulders drift
  # back together, keeping head-vs-shoulder angles small) still breaches as
  # deviation from that neutral. Deviation thresholds reuse the per-metric
  # bands above with the same hysteresis.
  baseline_deviation:
    enabled: true
    window_s: 300.0
  # MediaPipe landmark visibility must clear this floor for a score to be trusted.
  visibility_floor: 0.5
  # High-mount framing (camera well above head height) can keep hips out of
  # frame at working distance. Set false to require only ears and shoulders:
  # trunk lean then reports "unavailable" and drops out of the BAD decision,
  # but head-forward / head-tilt / shoulder-level reminders still fire.
  trunk_lean_required: true
  # Degraded feedback: when only the hips fall below the visibility floor,
  # still score head-forward / head-tilt / shoulder-level (trunk lean reports
  # unavailable and drops out of the BAD decision) instead of gating all
  # feedback. Ears or shoulders below the floor always gate.
  degraded_feedback: true
  # Framing gate: shoulder width as a fraction of the frame width stands in
  # for distance. Below min = too far, above max = too close.
  shoulder_width_min: 0.12
  shoulder_width_max: 0.65

state:
  smoothing_window_s: 0.3     # temporal smoothing over the last 0.3 s of samples
  bad_sustain_s: 2.0          # chime after bad posture is confirmed this long
  good_confirm_s: 1.0         # in thresholds this long -> state GOOD
  recovery_good_s: 3.0        # good this long after a chime -> back to GOOD
  voice_delay_s: 10.0         # spoken prompt this long after the chime
  voice_repeat_cooldown_s: 30.0  # minimum spacing between spoken prompts
  no_person_timeout_s: 2.0    # no pose this long -> NO_PERSON

audio:
  # PulseAudio/PipeWire sink name; null = first USB audio sink.
  sink: null
  # Spoken prompt wording (rendered by TTS; editable at runtime on the dashboard).
  voice_text: "Please fix your posture"
  # Optional custom WAV files (absolute, ~/..., or relative to the working
  # directory). bad_sound replaces the reminder chime; good_sound replaces the
  # positive / recovery chime. null or a missing file = built-in sound.
  bad_sound: null
  good_sound: null

feedback:
  positive_chime:
    enabled: true        # reward sustained good posture with an upbeat chime
    every_seconds: 120   # fire at most this often while posture stays GOOD
  recovery_chime:
    enabled: true        # play the good sound once when you recover after a reminder

needle:
  # Posture needle on the dashboard: -1 upright, +1 at the bad thresholds (or
  # at your recorded slouch once calibrated). Display only.
  tau_s: 0.5             # EMA time constant; alpha = 1 - exp(-dt / tau_s)

calibration:
  window_s: 3.0          # seconds recorded by "Record good / slouch posture"
  min_samples: 5         # scored frames needed for a valid recording

