name: ci

on:
  push:
    # "**" (not "*") so branches with a slash, e.g. feat/webcam-v2, run CI too.
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  browser-core:
    # docs/app/posture-core.js (the GitHub Pages app) must match the Python
    # pipeline frame-for-frame on tests/fixtures/browser_golden.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser core parity + properties
        run: node --test "tests/js/*.test.mjs"

  vendored-files:
    # The app is self-hosted (issue #45): vendored MediaPipe files must exist
    # and match the sha256 values recorded in docs/app/vendor/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored files and checksums
        working-directory: docs/app/vendor
        run: |
          test -s LICENSE
          for f in vision_bundle.mjs pose_landmarker_lite.task \
                   wasm/vision_wasm_internal.js wasm/vision_wasm_internal.wasm \
                   wasm/vision_wasm_nosimd_internal.js wasm/vision_wasm_nosimd_internal.wasm; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            grep -q "$sum" README.md || { echo "checksum not in README: $f"; exit 1; }
          done
      - name: No third-party hosts in the app
        run: |
          if grep -rnE "cdn\.jsdelivr\.net|storage\.googleapis\.com" docs/app/*.js docs/app/index.html; then
            echo "app must not load from third-party hosts"; exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck setup.sh
          shellcheck -x Makefile

  webcam-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with webcam extra
        run: pip install '.[webcam,dev]'
      - name: Smoke-check real SDK APIs
        # Asserts the installed mediapipe/opencv wheels expose every
        # attribute webcam.py and pose.py use, so stubbed unit tests cannot
        # hide API drift. A missing wheel for this Python fails loudly here.
        run: python tests/smoke_hardware.py
