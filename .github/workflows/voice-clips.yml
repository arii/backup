name: voice-clips

# Renders every line in docs/app/voice-lines.js with Kokoro-82M (Apache-2.0)
# into docs/app/voice/*.mp3 + manifest.json and commits them back to the
# branch, so the app plays a natural recorded voice instead of the browser's
# speechSynthesis. Runs on feature branches only (never commits to main).
on:
  push:
    branches-ignore: [main]
    paths:
      - "docs/app/voice-lines.js"
      - "docs/app/posture-core.js"
      - "scripts/render-voice.mjs"
      - ".github/workflows/voice-clips.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-clips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg
      - name: Install kokoro-js
        # onnxruntime-node otherwise downloads CUDA libraries at install time.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm install --no-save --no-package-lock --onnxruntime-node-install-cuda=skip kokoro-js@1
      - name: Render clips
        run: node scripts/render-voice.mjs
      - name: Commit clips if they changed
        run: |
          # Offline mode precaches the clips: refresh precache.json, sw.js version and the quoted size in the docs.
          node scripts/gen-precache.mjs
          git add docs/app/voice docs/app/precache.json docs/app/sw.js docs/privacy.html README.md
          if git diff --cached --quiet; then echo "clips unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Render voice clips with Kokoro-82M"
          git push
